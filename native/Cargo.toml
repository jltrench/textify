[package]
name = "textify"
version = "0.1.0"
edition = "2021"
description = "Screen OCR for Omarchy - extract text from any region of the screen"
license = "MIT"
repository = "https://github.com/jltrench/textify"

[[bin]]
name = "textify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
